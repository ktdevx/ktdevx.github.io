name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Hugo
        env:
          HUGO_VERSION: "0.133.1"
        run: |
          wget -q -O ${{ runner.temp }}/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          tar -xzf ${{ runner.temp }}/hugo.tar.gz -C ${{ runner.temp }}
          sudo mv ${{ runner.temp }}/hugo /usr/local/bin
          hugo version
      - name: Install monde
        env:
          GH_TOKEN: ${{ secrets.MONDE_TOKEN }}
          MONDE_VERSION: "0.1.0"
        run: |
          dir=${{ runner.temp }}/monde
          gh release download "v${MONDE_VERSION}" --repo ktdevx/monde-private --dir "$dir" \
            --pattern "monde-${MONDE_VERSION}-linux-x64.tar.gz" --pattern SHA256SUMS
          cd "$dir"
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf "monde-${MONDE_VERSION}-linux-x64.tar.gz"
          sudo install "monde-${MONDE_VERSION}-linux-x64/monde" /usr/local/bin/monde
          monde --version
      - name: Check that the translation files are up to date
        if: github.event_name == 'pull_request'
        run: |
          tools/l10n.sh update
          if [ -n "$(git status --porcelain -- po)" ]; then
            git status --short -- po
            echo "::error::po/ is out of date with content/ja. Run 'tools/l10n.sh update' and commit the result."
            exit 1
          fi
      - name: Report the translation status
        run: |
          {
            echo '## Translation status'
            echo '```'
            tools/l10n.sh status | grep -v ' done$' || echo 'All pages are translated.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the translated pages
        run: tools/l10n.sh build
      - name: Build with Hugo
        run: hugo --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4